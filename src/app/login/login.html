  <div class="login">
  <!-- Left Section: Scenic Visual -->
  <div class="left-section">
    <div class="brand">
      <h1>ExploreHub's Tours</h1>
      <p>Travel is the only purchase that enriches you in ways<br>beyond material wealth</p>
    </div>
  </div>

  <!-- Right Section: Login Form -->
  <div class="login-wrapper">
    <div class="logo-container">
      <img src="assets/icons/logo1.png" alt="Your Logo" class="logo" (click)="goHome()" />
    </div>

    <div class="plane-trail"></div>
    <i class="fas fa-plane plane-icon"></i>

    <div class="login-container">
      <h2>Welcome to ExploreHub</h2>

      <p *ngIf="isSignUpMode">Create your account below.</p>
      <p *ngIf="!isSignUpMode">Please sign in using your credentials.</p>

      <form>
        <!-- Sign-Up Form -->
        <!-- <div class="signup"> -->
          <div class="signup"   *ngIf="isSignUpMode">
          <input type="text" [(ngModel)]="name" name="name" placeholder="Full Name*" required />
          <input type="email" [(ngModel)]="email" name="email" placeholder="Email*" required />
          <input type="password" [(ngModel)]="password" name="password" placeholder="Password*" required />
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password*" required />
          <button type="button" class="btn btn-outline-primary" (click)="signUp()">Sign-Up</button>
          <button type="button" class="btn btn-link" (click)="toggleMode()">Already have an account? Sign-In</button>
        </div>
        <!-- </div> -->

        <!-- Sign-In Form -->
         <!-- <div class="sign"> -->
        <div  *ngIf="!isSignUpMode">
          <input type="email" [(ngModel)]="email" name="email" placeholder="Email*" required />
          <input type="password" [(ngModel)]="password" name="password" placeholder="Password*" required />
          <button type="button" class="btn btn-primary" (click)="signIn()">Sign-In</button>
          <button type="button" class="btn btn-link" (click)="toggleMode()">New user? Sign-Up</button>
        </div>
        <!-- </div> -->
      </form>

      <!-- Login Success Popup -->
      <div *ngIf="loginSuccess" class="login-popup">
        <div class="popup-content">
          <div class="success-icon">✔</div>
          <div class="success-text">LOGIN SUCCESSFUL</div>
        </div>
      </div>
      <!-- User Welcome Section -->
      <div *ngIf="user" class="user-section">
      <p>Welcome, {{ user.displayName || name || user.email }}</p>
      <button (click)="logout()">Logout</button>
      </div>
    </div>

  </div>
</div>
